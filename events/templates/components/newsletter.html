{% load static %}
<section class="py-20 bg-orange-500 mt-20">
  <div class="container mx-auto px-6 lg:px-16">
    <div
      class="bg-white rounded-[3rem] p-8 md:p-16 shadow-2xl flex flex-col lg:flex-row items-center justify-between gap-12 overflow-hidden relative"
    >
      <!-- Decorative Circle -->
      <div
        class="absolute -top-24 -right-24 w-64 h-64 bg-orange-100 rounded-full opacity-50"
      ></div>
      <div
        class="absolute -bottom-24 -left-24 w-64 h-64 bg-blue-50 rounded-full opacity-50"
      ></div>

      <div class="relative z-10 lg:w-1/2">
        <h2 class="text-4xl font-extrabold text-gray-800 mb-6">
          Stay Updated with <span class="text-orange-500">EVENTYFLY</span>
        </h2>
        <p class="text-gray-600 text-lg leading-relaxed mb-8">
          Subscribe to our newsletter and never miss an update on the most
          exciting events happening around you. Get exclusive early-bird access
          and more!
        </p>

        <form class="flex flex-col sm:flex-row gap-4">
          <input
            type="email"
            placeholder="Enter your email"
            class="flex-grow px-6 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-orange-500 transition"
          />
          <button
            type="submit"
            class="px-8 py-4 bg-orange-500 text-white font-bold rounded-2xl shadow-lg shadow-orange-200 hover:bg-orange-600 transition transform active:scale-95 whitespace-nowrap"
          >
            Subscribe Now
          </button>
        </form>
      </div>

      <div class="relative z-10 lg:w-1/3 flex justify-center">
        <div class="relative">
          <img
            src="https://images.unsplash.com/photo-1517457373958-b7bdd4587205?auto=format&fit=crop&w=600&q=80"
            alt="Newsletter"
            class="w-64 h-80 object-cover rounded-3xl shadow-2xl rotate-3 hover:rotate-0 transition duration-500"
          />
          <div
            class="absolute -bottom-6 -right-6 w-24 h-24 bg-blue-500 rounded-2xl flex items-center justify-center shadow-xl -rotate-6"
          >
            <svg
              class="w-12 h-12 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
              ></path>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
